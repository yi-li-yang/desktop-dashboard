[package]
name = "desktop-dashboard"
version = "0.1.0"
description = "Lightweight desktop widget showing live Claude usage stats"
authors = ["Yili Yang"]
edition = "2021"

[lib]
name = "desktop_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
async-trait = "0.1"
dirs = "6"

[profile.release]
opt-level = "s"
lto = true
strip = true
